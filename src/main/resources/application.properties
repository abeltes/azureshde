spring.application.name=hrmws
spring.profiles.active=@active.spring.profile@

spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//ia01rg49d-vzho1-scan.ociia01rg49wgd.ociia01rg49wgd.oraclevcn.com:1521/HRMSTSTC_HRMSDEV.paas.oracle.com}
spring.datasource.username=${ORACLE_DB_USERNAME:hrm_ws}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect


# FOTA Environment Configuration
hrmws.fota_credentials={"username": "${FOTA_USERNAME}", "password": "${FOTA_PASSWORD}"}

hrmws.fota_tokenid=1
hrmws.fota_baseurl=http://hvitestdate2.aade.int

hrmws.fota_token_endpoint=/HrmsWebApi/Auth/GenerateAccessToken
hrmws.fota_tutors_endpoint=/HrmsWebApi/Fota/Tutors 
hrmws.fota_participants_endpoint=/HrmsWebApi/Fota/Participants
hrmws.fota_seminars_endpoint=/HrmsWebApi/Fota/Seminars
hrmws.fota_identities_endpoint=/HrmsWebApi/Identities

hrmws.newtokenapi=/api/v1/newtoken
hrmws.tutorsapi=/api/v1/tutors
hrmws.participantsapi=/api/v1/participants
hrmws.seminarsapi=/api/v1/seminars
hrmws.identitiesapi=/api/v1/identities

# SHDE Environment Configuration
hrmws.shde_credentials={"ClientId": "${SHDE_CLIENT_ID}", "ClientSecret": "${SHDE_CLIENT_SECRET}"}

hrmws.shde_tokenid=2
hrmws.shde_pkikey=1
hrmws.shde_baseurl=https://shde-test.aade.gr

hrmws.shde_token_endpoint=/services/v2/authentication/token
hrmws.shde_docs_endpoint=/services/v2/document/get
hrmws.shde_files_endpoint=/services/v2/document
hrmws.shde_groups_endpoint=/services/v2/organization/groupswithrole
hrmws.shde_register_endpoint=/services/v2/document/register

hrmws.shdegetdocapi=/api/v1/shdegetdoc
hrmws.shdegetfileapi=/api/v1/shdegetfile
hrmws.shdegetgroupsapi=/api/v1/shdegroups
hrmws.shderegisterapi=/api/v1/shderegister

server.error.whitelabel.enabled=false
server.error.include-message=always
